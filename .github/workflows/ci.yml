name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all modules
        run: python -m py_compile app.py ai.py db.py retrieval.py setup_db.py

      - name: Seed a fresh database and verify seed data
        run: |
          rm -f jirani.db
          python setup_db.py
          python - <<'PY'
          import sqlite3

          conn = sqlite3.connect("jirani.db")
          tickets = conn.execute("SELECT COUNT(*) FROM tickets").fetchone()[0]
          current = conn.execute("SELECT COUNT(*) FROM clauses c JOIN policy_documents p ON c.policy_document_id = p.id WHERE p.status = 'current'").fetchone()[0]
          outdated = conn.execute("SELECT COUNT(*) FROM clauses c JOIN policy_documents p ON c.policy_document_id = p.id WHERE p.status = 'outdated'").fetchone()[0]

          assert tickets > 0, "no tickets seeded"
          assert current > 0, "no current policy clauses seeded"
          assert outdated > 0, "no outdated policy clauses seeded"

          print(f"tickets={tickets} current_clauses={current} outdated_clauses={outdated}")
          conn.close()
          PY

      - name: Verify retrieval returns only current clauses
        run: |
          python - <<'PY'
          from retrieval import retrieve_current_clauses, find_outdated_matches

          current = retrieve_current_clauses("return refund damaged item", top_k=4)
          assert current, "retrieval returned no current clauses"
          assert all(c["status"] == "current" for c in current), "outdated clause leaked into citations"

          outdated = find_outdated_matches("return refund damaged item", top_k=1)
          assert all(c["status"] == "outdated" for c in outdated)

          print(f"current citations: {[c['version'] for c in current]}")
          PY